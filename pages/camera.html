<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camera App</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1218;
      --panel: #1a1f2a;
      --panel-2: #212a37;
      --text: #ebf0ff;
      --muted: #9aa8c2;
      --accent: #7c8cff;
      --border: #2d3749;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0e1218, #171d2a);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .app {
      width: min(900px, 92vw);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .header {
      padding: 18px 20px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
    }

    .status {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .stage {
      position: relative;
      min-height: 420px;
      background: #0b0d12;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    video, img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      background: #000;
    }

    .placeholder {
      text-align: center;
      color: var(--muted);
      padding: 30px;
      font-size: 1.2rem;
    }

    .placeholder span {
      display: block;
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 18px;
      background: var(--panel-2);
      border-top: 1px solid var(--border);
    }

    button {
      border: 1px solid var(--border);
      background: #2a3344;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 0.96rem;
    }

    button.primary {
      background: var(--accent);
      color: #101521;
      border-color: transparent;
      font-weight: 700;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #downloadPhoto,
    #retake {
      display: none;
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .controls {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Camera App</h1>
      <div id="status" class="status">Camera is off</div>
    </div>

    <div class="stage">
      <div id="placeholder" class="placeholder">
        <span>📷</span>
        Camera preview will appear here
      </div>
      <video id="video" autoplay playsinline></video>
      <img id="snapshot" alt="Captured photo" />
    </div>

    <div class="controls">
      <button id="startCamera" class="primary">Start camera</button>
      <button id="takePhoto" disabled>Take photo</button>
      <button id="retake">Retake</button>
      <button id="downloadPhoto">Download</button>
      <button id="stopCamera">Stop camera</button>
    </div>
  </div>

  <canvas id="canvas" hidden></canvas>

  <script>
    const video = document.getElementById("video");
    const snapshot = document.getElementById("snapshot");
    const placeholder = document.getElementById("placeholder");
    const status = document.getElementById("status");
    const canvas = document.getElementById("canvas");

    let stream = null;
    let photoUrl = null;

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        status.textContent = "Camera not supported";
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        video.srcObject = stream;
        video.style.display = "block";
        snapshot.style.display = "none";
        placeholder.style.display = "none";

        document.getElementById("takePhoto").disabled = false;
        document.getElementById("stopCamera").disabled = false;
        status.textContent = "Camera is on";
      } catch (error) {
        status.textContent = "Camera permission denied";
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      video.style.display = "none";
      snapshot.style.display = "none";
      placeholder.style.display = "block";

      document.getElementById("takePhoto").disabled = true;
      document.getElementById("stopCamera").disabled = true;
      document.getElementById("retake").style.display = "none";
      document.getElementById("downloadPhoto").style.display = "none";

      status.textContent = "Camera is off";
    }

    function takePhoto() {
      if (!video.videoWidth || !video.videoHeight) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        if (!blob) return;

        if (photoUrl) URL.revokeObjectURL(photoUrl);

        photoUrl = URL.createObjectURL(blob);
        snapshot.src = photoUrl;
        snapshot.style.display = "block";
        video.style.display = "none";

        document.getElementById("retake").style.display = "inline-block";
        document.getElementById("downloadPhoto").style.display = "inline-block";
        status.textContent = "Photo captured";
      }, "image/png");
    }

    function retake() {
      snapshot.style.display = "none";
      video.style.display = "block";
      document.getElementById("retake").style.display = "none";
      document.getElementById("downloadPhoto").style.display = "none";
      status.textContent = stream ? "Camera is on" : "Camera is off";
    }

    function downloadPhoto() {
      if (!photoUrl) return;

      const link = document.createElement("a");
      link.href = photoUrl;
      link.download = "snapshot.png";
      link.click();
    }

    document.getElementById("startCamera").addEventListener("click", startCamera);
    document.getElementById("stopCamera").addEventListener("click", stopCamera);
    document.getElementById("takePhoto").addEventListener("click", takePhoto);
    document.getElementById("retake").addEventListener("click", retake);
    document.getElementById("downloadPhoto").addEventListener("click", downloadPhoto);

    document.getElementById("stopCamera").disabled = true;
  </script>
</body>
</html>
