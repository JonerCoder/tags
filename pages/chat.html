<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EBMS Lauchpage</title>
  <link rel="icon" type="x-icon" href="ebms.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #10131b;
      color: #eef1f8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #6d7cff;
      color: white;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.1); }

    button.danger { background: #a63e50; }

    input {
      min-width: 0;
      border: 1px solid #34394a;
      border-radius: 8px;
      padding: 11px 12px;
      background: #171b26;
      color: inherit;
    }

    .owner-name {
      font-weight: 800;
      font-style: italic;
      color: #fff3a6;
      background: linear-gradient(90deg, #fff3a6, #ffaeef, #a9eaff, #fff3a6);
      background-size: 250% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: owner-shine 2.5s linear infinite;
    }

    @keyframes owner-shine {
      to { background-position: 250% center; }
    }

    .panel {
      width: min(760px, 100%);
      background: #191d28;
      border: 1px solid #303546;
      border-radius: 14px;
      box-shadow: 0 16px 50px #0005;
      overflow: hidden;
    }

    .notice {
      margin: 0;
      padding: 10px 16px;
      background: #342b19;
      color: #ffe6a3;
      font-size: .88rem;
    }

    #joinView {
      max-width: 440px;
      margin: auto;
      padding: 26px;
    }

    #joinView h1 { margin-top: 0; }

    .form { display: grid; gap: 12px; }
    .hint, #status { color: #aab1c4; font-size: .9rem; }
    #status { min-height: 1.3em; margin: 12px 0 0; }
    #status.error { color: #ff9a9a; }

    #chatView {
      display: none;
      height: min(720px, 88vh);
      min-height: 430px;
    }

    .topbar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid #303546;
    }

    .topbar span { color: #b7bed0; }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    #ownerControls {
      display: none;
      gap: 8px;
    }

    main {
      min-width: 0;
      height: calc(100% - 58px);
      display: flex;
      flex-direction: column;
    }

    #chatTitle {
      margin: 0;
      padding: 15px 18px;
      border-bottom: 1px solid #303546;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 10px 12px;
      border-radius: 10px;
      background: #252b3b;
      overflow-wrap: anywhere;
    }

    .message.mine {
      align-self: flex-end;
      background: #343e70;
    }

    .message-meta {
      margin-bottom: 4px;
      color: #b7bed0;
      font-size: .78rem;
    }

    .message-text { white-space: pre-wrap; }

    .message-delete {
      margin-top: 8px;
      padding: 5px 8px;
      font-size: .8rem;
      background: #a63e50;
      border-radius: 7px;
      color: white;
    }

    #sendForm {
      display: flex;
      gap: 9px;
      padding: 12px;
      border-top: 1px solid #303546;
    }

    #messageInput { flex: 1; }

    @media (max-width: 600px) {
      body { padding: 0; }
      .panel { border-radius: 0; min-height: 100vh; }
      #chatView { height: 100vh; }
      .topbar { align-items: flex-start; }
      .top-actions { max-width: 75%; }
      .top-actions button { padding: 8px 10px; }
      #messages { padding: 12px; }
    }
  </style>
</head>
<body>
  <section class="panel">
    <p class="notice">
      Public MQTT chat: messages and usernames are not private. Don’t share sensitive information.
    </p>

    <section id="joinView">
      <h1>Choose a Username!</h1>
      <p class="hint">Enter your username.</p>
      <form id="joinForm" class="form">
        <input id="usernameInput" maxlength="24" placeholder="Username" required>
        <button type="submit">Join chat</button>
      </form>
      <p id="status" role="status">Not connected.</p>
    </section>

    <section id="chatView">
      <header class="topbar">
        <strong>MQTT Chat</strong>
        <div class="top-actions">
          <span id="currentUser"></span>
          <div id="ownerControls">
            <button type="button" class="danger" id="clearButton">Clear chat</button>
            <button type="button" class="danger" id="kickButton">Kick user</button>
          </div>
          <button type="button" id="leaveButton">Leave</button>
        </div>
      </header>

      <main>
        <h2 id="chatTitle">Everyone’s Chat</h2>
        <div id="messages" aria-live="polite"></div>
        <form id="sendForm">
          <input id="messageInput" maxlength="1000" placeholder="Write a message…"
                 autocomplete="off" required>
          <button type="submit">Send</button>
        </form>
      </main>
    </section>
  </section>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
    "use strict";

    // Everyone must use the same broker and namespace to share this chat.
    const NAMESPACE = "school-chat-demo-v1";
    const BROKER_URL = "wss://broker.emqx.io:8084/mqtt";
    const CHAT_TOPIC = NAMESPACE + "/chat";

    // Password is hidden in reverse as a basic obfuscation, not secure protection.
    const OBFUSCATED_OWNER_PASSWORD = "30revir-kcalb";

    const $ = (id) => document.getElementById(id);
    let client = null;
    let username = "";
    let isOwner = false;

    function setStatus(message, isError = false) {
      $("status").textContent = message;
      $("status").classList.toggle("error", isError);
    }

    function makeMessageId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function removeMessage(messageId) {
      const item = [...$("messages").children]
        .find((element) => element.dataset.messageId === messageId);
      if (item) item.remove();
    }

    function addMessage(message) {
      if (!message || typeof message.text !== "string" ||
          typeof message.id !== "string") return;

      const bubble = document.createElement("article");
      bubble.className = "message" + (message.username === username ? " mine" : "");
      bubble.dataset.messageId = message.id;

      const meta = document.createElement("div");
      meta.className = "message-meta";

      const name = document.createElement("span");
      const authorName = message.username || "Anonymous";
      name.textContent = authorName;

      if (authorName === "Owner") {
        name.classList.add("owner-name");
      }

      const timestamp = document.createElement("span");
      const date = new Date(message.time);
      timestamp.textContent = " · " +
        (Number.isNaN(date.getTime()) ? "" : date.toLocaleTimeString());

      meta.append(name, timestamp);

      const text = document.createElement("div");
      text.className = "message-text";
      text.textContent = message.text;

      bubble.append(meta, text);

      if (isOwner && authorName !== "Owner") {
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "message-delete";
        deleteButton.textContent = "Delete message";
        deleteButton.addEventListener("click", () => {
          publishAction({ type: "delete", messageId: message.id });
        });
        bubble.append(deleteButton);
      }

      $("messages").append(bubble);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    function publishAction(action) {
      if (!isOwner) {
        setStatus("Only the owner can use moderation controls.", true);
        return;
      }

      if (!client || !client.connected) {
        setStatus("Not connected to the broker. Action was not sent.", true);
        return;
      }

      client.publish(CHAT_TOPIC, JSON.stringify({
        ...action,
        by: username
      }), { qos: 0 }, (error) => {
        if (error) setStatus("Could not send the moderation action.", true);
      });
    }

    function handleModerationAction(data) {
      if (!data || typeof data !== "object") return;

      if (data.type === "delete" && typeof data.messageId === "string") {
        removeMessage(data.messageId);
      } else if (data.type === "clear") {
        $("messages").replaceChildren();
      } else if (
        data.type === "kick" &&
        typeof data.target === "string" &&
        data.target.toLowerCase() === username.toLowerCase()
      ) {
        if (client) client.end(true);
        client = null;
        username = "";
        isOwner = false;
        $("ownerControls").style.display = "none";
        $("chatView").style.display = "none";
        $("joinView").style.display = "block";
        $("usernameInput").value = "";
        $("messages").replaceChildren();
        setStatus("You were kicked from the chat.", true);
      }
    }

    function connect() {
      if (typeof mqtt === "undefined") {
        setStatus("Could not load MQTT.js. Check your internet connection or whether the school network blocks the CDN.", true);
        return;
      }

      const randomId = Math.random().toString(16).slice(2);
      client = mqtt.connect(BROKER_URL, {
        clientId: "chat_" + Date.now().toString(36) + "_" + randomId,
        clean: true,
        connectTimeout: 10000,
        reconnectPeriod: 3000
      });

      client.on("connect", () => {
        setStatus("Connected to MQTT broker.");
        client.subscribe(CHAT_TOPIC, { qos: 0 }, (error) => {
          if (error) setStatus("Could not subscribe to the chat.", true);
        });
      });

      client.on("reconnect", () => setStatus("Reconnecting…"));
      client.on("offline", () => setStatus("Offline. Trying to reconnect…", true));
      client.on("error", () => {
        setStatus("Could not connect. The broker may be blocked or unavailable.", true);
      });

      client.on("message", (topic, payload) => {
        if (topic !== CHAT_TOPIC) return;

        try {
          const data = JSON.parse(payload.toString());
          if (data.type === "chat") {
            addMessage(data);
          } else {
            handleModerationAction(data);
          }
        } catch {
          // Ignore malformed messages.
        }
      });
    }

    $("joinForm").addEventListener("submit", (event) => {
      event.preventDefault();

      const requestedName = $("usernameInput").value.trim().replace(/\s+/g, " ");
      if (!requestedName) return;

      isOwner = false;
      if (requestedName.toLowerCase() === "owner") {
        const enteredPassword = window.prompt("Owner password:");
        if (enteredPassword === null) return;

        const expectedPassword = OBFUSCATED_OWNER_PASSWORD.split("").reverse().join("");

        if (enteredPassword !== expectedPassword) {
          setStatus("Incorrect owner password.", true);
          return;
        }

        isOwner = true;
        username = "Owner";
      } else {
        username = requestedName;
      }

      const currentUser = $("currentUser");
      currentUser.textContent = username + (isOwner ? " (Owner)" : "");
      currentUser.classList.toggle("owner-name", isOwner);

      $("ownerControls").style.display = isOwner ? "flex" : "none";
      $("joinView").style.display = "none";
      $("chatView").style.display = "block";
      $("messages").replaceChildren();
      connect();
    });

    $("clearButton").addEventListener("click", () => {
      if (window.confirm("Clear the messages currently shown to connected chat users?")) {
        publishAction({ type: "clear" });
      }
    });

    $("kickButton").addEventListener("click", () => {
      const target = window.prompt("Enter the username to kick:");
      if (target === null) return;

      const cleanTarget = target.trim().replace(/\s+/g, " ");
      if (!cleanTarget) return;

      publishAction({ type: "kick", target: cleanTarget });
    });

    $("leaveButton").addEventListener("click", () => {
      if (client) client.end(true);
      client = null;
      username = "";
      isOwner = false;
      $("ownerControls").style.display = "none";
      $("chatView").style.display = "none";
      $("joinView").style.display = "block";
      $("usernameInput").value = "";
      $("messages").replaceChildren();
      $("currentUser").textContent = "";
      $("currentUser").classList.remove("owner-name");
      setStatus("Not connected.");
    });

    $("sendForm").addEventListener("submit", (event) => {
      event.preventDefault();

      const text = $("messageInput").value.trim();
      if (!text) return;

      if (!client || !client.connected) {
        setStatus("Not connected to the broker. Message was not sent.", true);
        return;
      }

      client.publish(CHAT_TOPIC, JSON.stringify({
        type: "chat",
        id: makeMessageId(),
        username,
        text,
        time: new Date().toISOString()
      }), { qos: 0 });

      $("messageInput").value = "";
      $("messageInput").focus();
    });
  </script>
</body>
</html>
