<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Playground</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --panel-2: #0f172a;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #8b5cf6;
      --border: #334155;
      --code-bg: #0b1120;
      --shadow: rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { filter: brightness(1.08); }

    .workspace {
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      gap: 14px;
      padding: 20px;
    }

    .editor-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 20px var(--shadow);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a2436;
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    textarea {
      width: 100%;
      height: 260px;
      resize: vertical;
      border: none;
      outline: none;
      background: var(--code-bg);
      color: #dbeafe;
      padding: 14px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .preview {
      margin: 0 20px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 20px var(--shadow);
    }

    .preview-header {
      background: #1a2436;
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      color: var(--muted);
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
    }

    iframe {
      display: block;
      width: 100%;
      height: 360px;
      border: none;
      background: white;
    }

    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Code Playground</h1>
    <button id="runBtn">Run Code</button>
  </div>

  <div class="workspace">
    <div class="editor-panel">
      <div class="panel-header">
        <span>HTML</span>
        <span>index.html</span>
      </div>
      <textarea id="htmlCode" spellcheck="false"><main class="demo">
  <h1>Hello, world! 👋</h1>
  <p>Make something cool.</p>
  <button id="helloBtn">Click me</button>
  <p id="message"></p>
</main></textarea>
    </div>

    <div class="editor-panel">
      <div class="panel-header">
        <span>CSS</span>
        <span>style.css</span>
      </div>
      <textarea id="cssCode" spellcheck="false">body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #eef2ff, #dbeafe);
  color: #1f2937;
}

.demo {
  text-align: center;
  padding: 30px;
}

button {
  background: #8b5cf6;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 10px 16px;
  cursor: pointer;
}</textarea>
    </div>

    <div class="editor-panel">
      <div class="panel-header">
        <span>JavaScript</span>
        <span>script.js</span>
      </div>
      <textarea id="jsCode" spellcheck="false">document.getElementById("helloBtn").addEventListener("click", () => {
  document.getElementById("message").textContent = "Nice! Your code is running.";
});</textarea>
    </div>
  </div>

  <div class="preview">
    <div class="preview-header">
      <span>Live Preview</span>
      <span>Sandboxed output</span>
    </div>
    <iframe id="previewFrame" title="Live preview"></iframe>
  </div>

  <script>
    const htmlInput = document.getElementById("htmlCode");
    const cssInput = document.getElementById("cssCode");
    const jsInput = document.getElementById("jsCode");
    const previewFrame = document.getElementById("previewFrame");

    function runCode() {
      const html = htmlInput.value;
      const css = cssInput.value;
      const js = jsInput.value;

      previewFrame.srcdoc = `
        <!doctype html>
        <html>
          <head>
            <meta charset="utf-8" />
            <style>${css}</style>
          </head>
          <body>
            ${html}
            <script>
              try {
                ${js}
              } catch (error) {
                document.body.insertAdjacentHTML(
                  "beforeend",
                  "<pre style='color:#b91c1c; padding: 12px; white-space: pre-wrap;'>" +
                  (error.stack || error.message) +
                  "</pre>"
                );
              }
            <\/script>
          </body>
        </html>
      `;
    }

    document.getElementById("runBtn").addEventListener("click", runCode);
    runCode();
  </script>
</body>
</html>
