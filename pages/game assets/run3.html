<!DOCTYPE html>
<html lang="en">
<head>
  <base href="https://cdn.jsdelivr.net/gh/VinMannie/Run_3@gh-pages/">
  <meta charset="utf-8">
  <title>Run 3</title>
  <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="shortcut icon" type="image/png" href="./favicon.png">

  <script>
    try {
      Object.defineProperty(navigator, "getGamepads", {
        configurable: true,
        value: function () {
          return [];
        }
      });
    } catch (error) {
      // Some browsers or policies block overriding this. This only helps where allowed.
    }
  </script>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/cooldude2349/bugfixes@main/Run3beta.js"></script>

  <script>
    window.addEventListener("touchmove", function (event) { event.preventDefault(); }, { capture: false, passive: false });

    if (typeof window.devicePixelRatio != "undefined" && window.devicePixelRatio > 2) {
      var meta = document.getElementById("viewport");
      meta.setAttribute("content", "width=device-width, initial-scale=" + (2 / window.devicePixelRatio) + ", user-scalable=no");
    }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #openfl-content {
      background: #000000;
      width: 100%;
      height: 100%;
    }

    @font-face {
      font-family: 'Comfortaa Bold';
      src: url('font/COMFORTAA-BOLD.eot?#iefix') format('embedded-opentype'),
           url('font/COMFORTAA-BOLD.woff') format('woff'),
           url('font/COMFORTAA-BOLD.TTF') format('truetype'),
           url('font/COMFORTAA-BOLD.svg#Comfortaa%20Bold') format('svg');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Comfortaa';
      src: url('font/Comfortaa.eot?#iefix') format('embedded-opentype'),
           url('font/Comfortaa.woff') format('woff'),
           url('font/Comfortaa.otf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Permanent Marker';
      src: url('font/PERMANENTMARKER.eot?#iefix') format('embedded-opentype'),
           url('font/PERMANENTMARKER.woff') format('woff'),
           url('font/PERMANENTMARKER.TTF') format('truetype'),
           url('font/PERMANENTMARKER.svg#Permanent%20Marker') format('svg');
      font-weight: normal;
      font-style: normal;
    }
  </style>
</head>
<body style="overflow:hidden;">

  <noscript>This webpage makes extensive use of JavaScript. Please enable JavaScript in your web browser to view this page.</noscript>

  <div id="openfl-content"></div>

  <script>
    const errorBox = document.createElement("pre");
    Object.assign(errorBox.style, {
      position: "fixed",
      inset: "10px",
      zIndex: "99999",
      padding: "16px",
      background: "#111",
      color: "#fff",
      whiteSpace: "pre-wrap",
      font: "16px monospace",
      overflow: "auto",
      border: "1px solid #444"
    });

    function showError(message) {
      errorBox.textContent += message + "\n\n";
      if (!errorBox.isConnected) document.body.appendChild(errorBox);
    }

    window.addEventListener("error", (event) => {
      const message = event.target && event.target.src
        ? "Failed to load: " + event.target.src
        : (event.message || "A script error occurred.");
      showError(message);
    }, true);

    window.addEventListener("unhandledrejection", (event) => {
      showError("Game startup error: " + (event.reason?.message || event.reason));
    });

    try {
      if (typeof lime === "undefined" || typeof lime.embed !== "function") {
        throw new Error("Run 3 startup failed: lime.embed is unavailable.");
      }
      lime.embed("Run3", "openfl-content", 800, 600, { parameters: {} });
    } catch (error) {
      showError(error.stack || error.message);
    }
  </script>

  <script src="js/analytics_ubg_v1_4.js"></script>
  <script src="js/redirect_v1_0.js"></script>
</body>
</html>
