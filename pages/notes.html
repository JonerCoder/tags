<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px system-ui, sans-serif;
      color: #202124;
      background: #f5f6fa;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      background: white;
      border-bottom: 1px solid #ddd;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    button {
      border: 0;
      border-radius: 8px;
      padding: .65rem .9rem;
      font: inherit;
      cursor: pointer;
      background: #315efb;
      color: white;
    }
    button:hover { filter: brightness(.92); }
    .layout {
      display: grid;
      grid-template-columns: minmax(180px, 280px) 1fr;
      min-height: calc(100vh - 65px);
    }
    aside {
      padding: 1rem;
      background: white;
      border-right: 1px solid #ddd;
    }
    #note-list { display: grid; gap: .5rem; }
    .note-item {
      text-align: left;
      color: #202124;
      background: #f1f3f4;
      overflow-wrap: anywhere;
    }
    .note-item.selected { background: #e4eaff; }
    main { padding: clamp(1rem, 4vw, 2.5rem); }
    input, textarea {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      font: inherit;
    }
    #title {
      margin-bottom: 1rem;
      font-size: 1.8rem;
      font-weight: 650;
    }
    #body {
      min-height: 65vh;
      resize: vertical;
      line-height: 1.6;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    #status { color: #687078; font-size: .9rem; }
    #delete {
      background: #e8eaed;
      color: #333;
    }
    @media (max-width: 600px) {
      .layout { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid #ddd; }
      #note-list { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
      #body { min-height: 45vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>My Notes</h1>
    <button id="new-note">＋ New note</button>
  </header>

  <div class="layout">
    <aside><div id="note-list"></div></aside>
    <main>
      <div class="toolbar">
        <span id="status" aria-live="polite">Saved</span>
        <button id="delete">Delete note</button>
      </div>
      <input id="title" placeholder="Note title" aria-label="Note title">
      <textarea id="body" placeholder="Start writing…" aria-label="Note text"></textarea>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "simple-notes-app";
    const list = document.querySelector("#note-list");
    const titleInput = document.querySelector("#title");
    const bodyInput = document.querySelector("#body");
    const status = document.querySelector("#status");

    let notes = [];
    let activeId = null;
    let saveTimer;

    try {
      notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (!Array.isArray(notes)) notes = [];
    } catch {
      notes = [];
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      status.textContent = "Saved";
      renderList();
    }

    function renderList() {
      list.replaceChildren();
      notes.forEach(note => {
        const button = document.createElement("button");
        button.className = "note-item" + (note.id === activeId ? " selected" : "");
        button.textContent = note.title.trim() || "Untitled note";
        button.addEventListener("click", () => openNote(note.id));
        list.append(button);
      });
    }

    function openNote(id) {
      activeId = id;
      const note = notes.find(item => item.id === id);
      titleInput.value = note?.title || "";
      bodyInput.value = note?.body || "";
      renderList();
    }

    function createNote() {
      const note = {
        id: crypto.randomUUID(),
        title: "",
        body: ""
      };
      notes.unshift(note);
      save();
      openNote(note.id);
      titleInput.focus();
    }

    function updateActiveNote() {
      const note = notes.find(item => item.id === activeId);
      if (!note) return;

      note.title = titleInput.value;
      note.body = bodyInput.value;
      status.textContent = "Saving…";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 250);
      renderList();
    }

    document.querySelector("#new-note").addEventListener("click", createNote);
    document.querySelector("#delete").addEventListener("click", () => {
      if (!activeId) return;
      notes = notes.filter(note => note.id !== activeId);
      if (notes.length === 0) {
        save();
        createNote();
      } else {
        activeId = notes[0].id;
        save();
        openNote(activeId);
      }
    });

    titleInput.addEventListener("input", updateActiveNote);
    bodyInput.addEventListener("input", updateActiveNote);

    if (notes.length === 0) createNote();
    else openNote(notes[0].id);
  </script>
</body>
</html>
