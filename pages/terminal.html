<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Terminal — Tags</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: #10131c;
      color: #e5e7eb;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #10131c; }
    .terminal { width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: #10131c; }
    .screen { flex: 1; min-height: 0; overflow: auto; padding: 18px 22px 10px; scrollbar-color: #3a4356 transparent; cursor: text; }
    #output { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.7; }
    .line { min-height: 1.7em; }
    .prompt { color: #7ee787; }
    .command { color: #f1f5f9; }
    .muted { color: #8994a8; }
    .error { color: #ff8a8a; }
    .accent { color: #8ab4ff; }
    .input-row { display: flex; align-items: center; gap: 9px; padding: 8px 22px 16px; }
    .input-prompt { color: #7ee787; white-space: nowrap; font-size: 13px; }
    #commandInput { flex: 1; min-width: 0; border: 0; outline: 0; padding: 5px 0; color: #f1f5f9; background: transparent; caret-color: #7ee787; font: inherit; font-size: 13px; }
    #commandInput::placeholder { color: #667085; }
    .hint { margin: 0; padding: 0 22px 12px; color: #697386; font: 11px/1.5 system-ui, sans-serif; }
    button:focus-visible, #commandInput:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 3px; }
    @media (max-width: 560px) { .screen { padding: 14px 14px 8px; } .input-row { padding: 8px 14px 14px; } .hint { padding: 0 14px 10px; } }
  </style>
</head>
<body>
  <main class="terminal" aria-label="Simulated terminal">
    <section class="screen" id="screen" aria-label="Terminal output" tabindex="0">
      <div id="output" aria-live="polite"></div>
    </section>
    <form class="input-row" id="commandForm" autocomplete="off">
      <label class="input-prompt" for="commandInput">guest@tags:~$</label>
      <input id="commandInput" type="text" spellcheck="false" autocapitalize="off" placeholder="type help and press Enter" aria-label="Enter a terminal command" autofocus>
    </form>
    <p class="hint">Simulated terminal; commands run in this page only. ↑/↓ command history · Ctrl/⌘+L clear screen</p>
  </main>
  <script>
    "use strict";
    const output = document.getElementById("output");
    const screen = document.getElementById("screen");
    const form = document.getElementById("commandForm");
    const input = document.getElementById("commandInput");
    const history = [];
    let historyIndex = 0;

    // Keep these titles aligned with the desktop app list in MAIN.html.
    const apps = [
      { name: "Chat!", url: "chat.html" },
      { name: "Camera", url: "camera.html" },
      { name: "Codespace", url: "codespace.html" },
      { name: "Calculator", url: "calculator.html" },
      { name: "Notes", url: "notes.html" },
      { name: "Weather", url: "weather.html" },
      { name: "Calendar", url: "calendar.html" },
      { name: "Settings", url: "settings.html" },
      { name: "Games", url: "launcher.html" },
      { name: "Terminal", url: "terminal.html" }
    ];
    const virtualFiles = {
      "README.md": "Tags desktop\nA browser-based school OS-style launchpage.\n\nTry `help` to see the available terminal commands.",
      "about.txt": "Tags Terminal is a simulated command-line playground.\nIt does not run operating-system commands or access your files."
    };

    function print(text = "", className = "") {
      const line = document.createElement("div");
      line.className = `line ${className}`.trim();
      line.textContent = text;
      output.appendChild(line);
      screen.scrollTop = screen.scrollHeight;
    }

    function printPrompt(command) {
      const line = document.createElement("div");
      line.className = "line";
      const prompt = document.createElement("span");
      prompt.className = "prompt";
      prompt.textContent = "guest@tags:~$ ";
      const typed = document.createElement("span");
      typed.className = "command";
      typed.textContent = command;
      line.append(prompt, typed);
      output.appendChild(line);
    }

    function normalizeAppName(name) {
      return name.trim().toLowerCase().replace(/[!\s_-]/g, "");
    }

    function openApp(query) {
      if (!query) {
        print("Usage: open <app name>", "muted");
        print(`Apps: ${apps.map((app) => app.name).join(", ")}`, "muted");
        return;
      }
      const app = apps.find((item) => normalizeAppName(item.name) === normalizeAppName(query));
      if (!app) {
        print(`open: app not found: ${query}. Try 'ls' to list apps.`, "error");
        return;
      }

      // The desktop exposes openApp in its page context. Calling it creates a
      // normal desktop app window instead of nesting another frame in Terminal.
      try {
        if (window.parent !== window && typeof window.parent.openApp === "function") {
          window.parent.openApp({
            title: app.name,
            url: `pages/${app.url}`,
            image: "",
            icon: "▣",
            color: "#778399"
          });
          print(`Opened ${app.name} in a desktop window.`, "accent");
          return;
        }
      } catch {
        // Cross-origin parent access is intentionally not used as a fallback.
      }

      print(`Opening ${app.name} in a new tab.`, "accent");
      const link = document.createElement("a");
      link.href = app.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = `Launch ${app.name}`;
      link.className = "line accent";
      output.appendChild(link);
    }

    function run(raw) {
      const command = raw.trim();
      if (!command) return;
      printPrompt(command);
      if (history.at(-1) !== command) history.push(command);
      historyIndex = history.length;

      const splitAt = command.search(/\s/);
      const name = (splitAt < 0 ? command : command.slice(0, splitAt)).toLowerCase();
      const argument = splitAt < 0 ? "" : command.slice(splitAt).trim();

      switch (name) {
        case "help":
          print("Available commands:", "accent");
          print("  help          Show this help message");
          print("  clear         Clear the terminal screen");
          print("  echo <text>   Print text");
          print("  date / time   Show the current date and time");
          print("  pwd           Show the virtual working directory");
          print("  ls            List all desktop apps");
          print("  open <app>    Open an app in a desktop window");
          print("  cat <file>    Read README.md or about.txt");
          print("  whoami        Show the current demo user");
          print("  uname         Show this simulated environment");
          print("  history       List commands entered in this session");
          print("This is a demo, not a real operating-system shell.", "muted");
          break;
        case "clear":
          output.replaceChildren();
          break;
        case "echo":
          print(argument);
          break;
        case "date":
        case "time":
          print(new Date().toString());
          break;
        case "pwd":
          print("/home/guest");
          break;
        case "ls":
          print("Desktop apps:", "accent");
          apps.forEach((app) => print(`  ${app.name}`));
          break;
        case "open":
          openApp(argument);
          break;
        case "cat":
          if (!argument) print("Usage: cat <file>", "muted");
          else if (Object.hasOwn(virtualFiles, argument)) print(virtualFiles[argument]);
          else print(`cat: ${argument}: file not found`, "error");
          break;
        case "whoami":
          print("guest");
          break;
        case "uname":
          print("Tags Web Terminal (simulated)");
          break;
        case "history":
          history.forEach((item, index) => print(`  ${index + 1}  ${item}`));
          break;
        default:
          print(`${name}: command not found. Type 'help' to see available commands.`, "error");
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const value = input.value;
      input.value = "";
      run(value);
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        event.preventDefault();
        if (event.key === "ArrowUp") historyIndex = Math.max(0, historyIndex - 1);
        else historyIndex = Math.min(history.length, historyIndex + 1);
        input.value = history[historyIndex] ?? "";
        input.setSelectionRange(input.value.length, input.value.length);
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "l") {
        event.preventDefault();
        output.replaceChildren();
      }
    });

    screen.addEventListener("click", () => input.focus());
    print("Tags Terminal [Version 1.2]", "accent");
    print("Welcome! Type 'help' to explore commands, 'ls' to list desktop apps, or 'open calculator' to launch one.", "muted");
    print();
    input.focus();
  </script>
</body>
</html>
