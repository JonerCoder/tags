<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4a9cf5">
  <title>EBMS Launchpage</title>
  <link rel="icon" type="x-icon" href="ebms.png">

  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      --sky-top: #4a9cf5;
      --sky-bottom: #b6e0ff;
      --card: rgb(255 255 255 / 22%);
      --card-border: rgb(255 255 255 / 30%);
      --text: #fff;
      --soft-text: rgb(255 255 255 / 78%);
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
      transition: background 1.4s ease;
    }

    body[data-weather="cloudy"] {
      --sky-top: #687e9a;
      --sky-bottom: #bdc9d6;
      --card: rgb(255 255 255 / 19%);
    }

    body[data-weather="rain"] {
      --sky-top: #354e70;
      --sky-bottom: #8095ab;
      --card: rgb(255 255 255 / 17%);
    }

    body[data-weather="snow"] {
      --sky-top: #7898b5;
      --sky-bottom: #d7e8f4;
      --card: rgb(255 255 255 / 25%);
    }

    body[data-weather="storm"] {
      --sky-top: #252c48;
      --sky-bottom: #67647f;
      --card: rgb(255 255 255 / 15%);
    }

    body[data-weather="fog"] {
      --sky-top: #8d9ba8;
      --sky-bottom: #d0d5d9;
      --card: rgb(255 255 255 / 24%);
    }

    .sky {
      position: fixed;
      z-index: -1;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      isolation: isolate;
    }

    .sky-glow {
      position: absolute;
      inset: -20%;
      opacity: .46;
      background:
        radial-gradient(ellipse at 75% 13%, rgb(255 247 195 / 60%), transparent 30%),
        radial-gradient(ellipse at 15% 50%, rgb(255 255 255 / 20%), transparent 38%);
      animation: glow-drift 14s ease-in-out infinite alternate;
      transition: opacity .8s ease;
    }

    .sun {
      position: absolute;
      top: 9vh;
      right: 12vw;
      width: clamp(100px, 22vw, 190px);
      aspect-ratio: 1;
      border-radius: 50%;
      opacity: .85;
      background: radial-gradient(circle at 35% 35%, #fffde8, #fff1ad 72%);
      box-shadow: 0 0 45px 18px rgb(255 243 186 / 35%);
      animation: sun-pulse 5s ease-in-out infinite alternate;
      transition: opacity .8s ease, transform 1s ease;
    }

    .cloud {
      position: absolute;
      left: -38vw;
      width: 35vw;
      min-width: 220px;
      height: 66px;
      border-radius: 100px;
      opacity: .34;
      background: linear-gradient(180deg, #fff, #edf5ff);
      filter: blur(1px);
      animation: cloud-drift 48s linear infinite;
      transition: opacity .8s ease, filter .8s ease;
    }

    .cloud::before,
    .cloud::after {
      position: absolute;
      content: "";
      border-radius: 50%;
      background: inherit;
    }

    .cloud::before {
      left: 17%;
      bottom: 17px;
      width: 39%;
      height: 82px;
    }

    .cloud::after {
      left: 48%;
      bottom: 10px;
      width: 31%;
      height: 66px;
    }

    .cloud-one { top: 22%; animation-duration: 58s; }
    .cloud-two {
      top: 43%;
      transform: scale(.8);
      opacity: .2;
      animation-duration: 72s;
      animation-delay: -28s;
    }
    .cloud-three {
      top: 68%;
      transform: scale(1.2);
      opacity: .15;
      animation-duration: 66s;
      animation-delay: -43s;
    }

    .rain {
      position: absolute;
      inset: -25% -10% 0;
      opacity: 0;
      background-image: repeating-linear-gradient(
        105deg,
        transparent 0 42px,
        rgb(255 255 255 / 42%) 43px 45px,
        transparent 46px 76px
      );
      background-size: 105px 170px;
      animation: rain-fall .65s linear infinite;
      transition: opacity .7s ease;
    }

    .rain::after {
      position: absolute;
      inset: 0;
      content: "";
      opacity: .45;
      background-image: repeating-linear-gradient(
        105deg,
        transparent 0 70px,
        rgb(255 255 255 / 28%) 71px 72px,
        transparent 73px 120px
      );
      background-size: 180px 220px;
      animation: rain-fall .95s linear infinite;
    }

    .snow {
      position: absolute;
      inset: -12% 0 0;
      opacity: 0;
      background-image:
        radial-gradient(circle, rgb(255 255 255 / 94%) 0 2px, transparent 3px),
        radial-gradient(circle, rgb(255 255 255 / 80%) 0 3px, transparent 4px),
        radial-gradient(circle, rgb(255 255 255 / 68%) 0 1px, transparent 2px);
      background-size: 95px 115px, 155px 175px, 65px 80px;
      background-position: 0 0, 40px 55px, 20px 30px;
      animation: snow-fall 12s linear infinite;
      transition: opacity .7s ease;
    }

    .fog-layer {
      position: absolute;
      inset: 25% -30%;
      opacity: 0;
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgb(255 255 255 / 18%) 35%,
        rgb(255 255 255 / 32%) 48%,
        transparent 72%
      );
      filter: blur(16px);
      transform: translateX(-8%);
      animation: fog-drift 12s ease-in-out infinite alternate;
      transition: opacity .7s ease;
    }

    .lightning {
      position: absolute;
      inset: 0;
      opacity: 0;
      background: #fff;
      animation: lightning-flash 7s linear infinite;
    }

    body[data-weather="cloudy"] .sun,
    body[data-weather="rain"] .sun,
    body[data-weather="storm"] .sun,
    body[data-weather="fog"] .sun {
      opacity: .2;
      transform: scale(.9);
    }

    body[data-weather="cloudy"] .cloud,
    body[data-weather="rain"] .cloud,
    body[data-weather="storm"] .cloud { opacity: .65; }

    body[data-weather="rain"] .rain,
    body[data-weather="storm"] .rain { opacity: .65; }

    body[data-weather="snow"] .snow { opacity: .9; }
    body[data-weather="fog"] .fog-layer { opacity: .8; }

    body[data-weather="fog"] .cloud {
      opacity: .42;
      filter: blur(9px);
    }

    body[data-weather="storm"] .lightning { animation-name: lightning-flash; }

    body[data-weather="cloudy"] .sky-glow,
    body[data-weather="rain"] .sky-glow,
    body[data-weather="storm"] .sky-glow,
    body[data-weather="fog"] .sky-glow { opacity: .12; }

    @keyframes cloud-drift {
      from { margin-left: 0; }
      to { margin-left: 150vw; }
    }

    @keyframes rain-fall {
      from { background-position: 0 0; }
      to { background-position: -48px 170px; }
    }

    @keyframes snow-fall {
      from {
        transform: translate3d(-2vw, -5vh, 0);
        background-position: 0 0, 40px 55px, 20px 30px;
      }
      to {
        transform: translate3d(3vw, 12vh, 0);
        background-position: 35px 230px, -20px 350px, 50px 160px;
      }
    }

    @keyframes sun-pulse {
      from { box-shadow: 0 0 42px 14px rgb(255 243 186 / 28%); }
      to { box-shadow: 0 0 78px 30px rgb(255 243 186 / 48%); }
    }

    @keyframes glow-drift {
      from { transform: translate3d(-2%, 0, 0) scale(1); }
      to { transform: translate3d(2%, 3%, 0) scale(1.08); }
    }

    @keyframes fog-drift {
      from { transform: translateX(-8%); }
      to { transform: translateX(8%); }
    }

    @keyframes lightning-flash {
      0%, 91%, 93%, 96%, 100% { opacity: 0; }
      91.5%, 92% { opacity: .25; }
      94% { opacity: .08; }
      94.5% { opacity: .32; }
    }

    main {
      width: min(100% - 32px, 520px);
      margin: 0 auto;
      padding: max(30px, env(safe-area-inset-top)) 0 36px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: .04em;
      text-shadow: 0 1px 5px rgb(0 0 0 / 10%);
    }

    button { font: inherit; cursor: pointer; }

    /* iOS-style temperature switch with visible unit labels */
    .unit-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 9px;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      background: var(--card);
      color: white;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .unit-label {
      color: var(--soft-text);
      font-size: .82rem;
      font-weight: 650;
      transition: color .2s ease;
    }

    .unit-label.active { color: white; }

    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 28px;
      flex: none;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      border: 1px solid rgb(255 255 255 / 30%);
      border-radius: 999px;
      background: rgb(70 75 84 / 40%);
      cursor: pointer;
      transition: background .2s ease;
    }

    .switch-track::before {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      content: "";
      background: white;
      box-shadow: 0 1px 4px rgb(0 0 0 / 25%);
      transition: transform .2s ease;
    }

    .switch input:checked + .switch-track { background: #34c759; }
    .switch input:checked + .switch-track::before { transform: translateX(18px); }

    .switch input:focus-visible + .switch-track {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    form {
      display: flex;
      gap: 8px;
      margin: 0 0 8px;
    }

    input#city {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      outline: none;
      color: white;
      background: var(--card);
      font: inherit;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    input#city::placeholder { color: var(--soft-text); }

    form button,
    .star-button {
      border: 1px solid var(--card-border);
      color: white;
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    form button {
      padding: 0 16px;
      border-radius: 14px;
      font-weight: 600;
    }

    button:focus-visible,
    input#city:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    #message {
      min-height: 1.4em;
      margin: 7px 4px 12px;
      color: var(--soft-text);
      font-size: .88rem;
    }

    .panel {
      overflow: hidden;
      margin-top: 12px;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 12px 32px rgb(20 50 80 / 8%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .panel-heading {
      margin: 0;
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgb(255 255 255 / 18%);
      color: var(--soft-text);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    #favorites {
      display: grid;
      gap: 8px;
      padding: 12px;
    }

    .favorite-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .favorite-open {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 12px;
      color: white;
      background: rgb(255 255 255 / 12%);
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .favorite-remove {
      width: 38px;
      height: 38px;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 12px;
      color: white;
      background: rgb(255 255 255 / 12%);
      font-size: 1.2rem;
    }

    .empty-favorites {
      margin: 0;
      padding: 4px;
      color: var(--soft-text);
      font-size: .9rem;
    }

    .hero {
      padding: 20px 10px 24px;
      text-align: center;
      text-shadow: 0 2px 12px rgb(0 0 0 / 10%);
    }

    .hero-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    #place {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 500;
      letter-spacing: -.03em;
      overflow-wrap: anywhere;
    }

    .star-button {
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.3rem;
    }

    #temperature {
      margin: 0;
      font-size: clamp(5.5rem, 26vw, 8rem);
      font-weight: 200;
      line-height: 1.05;
      letter-spacing: -.09em;
    }

    #description {
      margin: 4px 0;
      font-size: 1.35rem;
      font-weight: 500;
    }

    #high-low {
      margin: 4px 0 0;
      color: var(--soft-text);
      font-size: 1rem;
    }

    #hourly {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 4px;
      padding: 14px 8px 16px;
    }

    .hour {
      display: grid;
      justify-items: center;
      gap: 10px;
      min-width: 0;
      font-size: .85rem;
    }

    .hour-time { color: var(--soft-text); }
    .hour-icon { font-size: 1.25rem; }
    .hour-temp { font-size: 1rem; font-weight: 600; }

    #details { display: grid; grid-template-columns: repeat(2, 1fr); }

    .detail {
      min-height: 86px;
      padding: 14px 16px;
      border-top: 1px solid rgb(255 255 255 / 18%);
    }

    .detail:nth-child(odd) { border-right: 1px solid rgb(255 255 255 / 18%); }

    .detail-label {
      display: block;
      margin-bottom: 8px;
      color: var(--soft-text);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .detail-value { font-size: 1.1rem; font-weight: 600; }

    #forecast { padding: 0 16px; }

    .forecast-day {
      display: grid;
      grid-template-columns: 1fr 1.5fr auto;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      border-bottom: 1px solid rgb(255 255 255 / 18%);
    }

    .forecast-day:last-child { border-bottom: 0; }
    .forecast-condition { color: var(--soft-text); text-align: center; }
    .forecast-temps { font-variant-numeric: tabular-nums; text-align: right; }

    @media (max-width: 380px) {
      main { width: min(100% - 22px, 520px); }
      #hourly { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body data-weather="clear">
  <div class="sky" aria-hidden="true">
    <div class="sky-glow"></div>
    <div class="sun"></div>
    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>
    <div class="cloud cloud-three"></div>
    <div class="rain"></div>
    <div class="snow"></div>
    <div class="fog-layer"></div>
    <div class="lightning"></div>
  </div>

  <main>
    <div class="topbar">
      <h1>WEATHER</h1>

      <div class="unit-control" aria-label="Temperature units">
        <span class="unit-label" id="celsius-label">°C</span>
        <label class="switch" aria-label="Toggle between Celsius and Fahrenheit">
          <input id="unit-toggle" type="checkbox" role="switch">
          <span class="switch-track"></span>
        </label>
        <span class="unit-label" id="fahrenheit-label">°F</span>
      </div>
    </div>

    <form id="search-form">
      <input id="city" placeholder="Search city" required aria-label="Search city">
      <button type="submit">Search</button>
    </form>

    <p id="message" aria-live="polite"></p>

    <section class="panel" aria-label="Starred locations">
      <h2 class="panel-heading">Starred places</h2>
      <div id="favorites"></div>
    </section>

    <section class="hero" id="current" hidden>
      <div class="hero-heading">
        <h2 id="place"></h2>
        <button
          class="star-button"
          id="toggle-star"
          type="button"
          aria-label="Star this place"
          title="Star this place"
        >☆</button>
      </div>
      <div id="temperature"></div>
      <p id="description"></p>
      <p id="high-low"></p>
    </section>

    <section class="panel" id="hourly-panel" hidden>
      <h2 class="panel-heading">Next 24 hours</h2>
      <div id="hourly"></div>
    </section>

    <section class="panel" id="details-panel" hidden>
      <h2 class="panel-heading">Weather details</h2>
      <div id="details"></div>
    </section>

    <section class="panel" id="forecast-panel" hidden>
      <h2 class="panel-heading">5-day forecast</h2>
      <div id="forecast"></div>
    </section>
  </main>

  <script>
    const message = document.querySelector("#message");
    const favoritesElement = document.querySelector("#favorites");
    const FAVORITES_KEY = "weather-app-favorites";
    const UNIT_KEY = "weather-app-temperature-unit";

    let favorites = [];
    let currentPlace = null;
    let latestWeather = null;
    let unit = localStorage.getItem(UNIT_KEY) === "F" ? "F" : "C";

    try {
      const stored = JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]");
      if (Array.isArray(stored)) favorites = stored;
    } catch {
      favorites = [];
    }

    function displayTemperature(celsius) {
      const value = unit === "F" ? (celsius * 9 / 5) + 32 : celsius;
      return `${Math.round(value)}°${unit}`;
    }

    function weatherText(code) {
      if (code === 0) return "Clear";
      if ([1, 2].includes(code)) return "Mostly clear";
      if (code === 3) return "Cloudy";
      if ([45, 48].includes(code)) return "Fog";
      if ([51, 53, 55, 56, 57].includes(code)) return "Drizzle";
      if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return "Rain";
      if ([71, 73, 75, 77, 85, 86].includes(code)) return "Snow";
      if ([95, 96, 99].includes(code)) return "Thunderstorms";
      return "Mixed conditions";
    }

    function weatherIcon(code) {
      if (code === 0) return "☀️";
      if ([1, 2].includes(code)) return "🌤️";
      if ([3, 45, 48].includes(code)) return "☁️";
      if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return "🌧️";
      if ([71, 73, 75, 77, 85, 86].includes(code)) return "❄️";
      if ([95, 96, 99].includes(code)) return "⛈️";
      return "🌤️";
    }

    function weatherType(code) {
      if ([95, 96, 99].includes(code)) return "storm";
      if ([71, 73, 75, 77, 85, 86].includes(code)) return "snow";
      if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return "rain";
      if ([45, 48].includes(code)) return "fog";
      if ([2, 3].includes(code)) return "cloudy";
      return "clear";
    }

    function renderFavorites() {
      favoritesElement.replaceChildren();

      if (favorites.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty-favorites";
        empty.textContent = "Star a place to keep it handy.";
        favoritesElement.append(empty);
        return;
      }

      favorites.forEach((place, index) => {
        const row = document.createElement("div");
        row.className = "favorite-row";

        const openButton = document.createElement("button");
        openButton.className = "favorite-open";
        openButton.type = "button";
        openButton.textContent = `★ ${place.name}`;
        openButton.addEventListener("click", () => {
          showWeather(place.name, place.latitude, place.longitude);
        });

        const removeButton = document.createElement("button");
        removeButton.className = "favorite-remove";
        removeButton.type = "button";
        removeButton.textContent = "×";
        removeButton.setAttribute("aria-label", `Remove ${place.name} from starred places`);
        removeButton.title = "Remove from starred places";
        removeButton.addEventListener("click", () => {
          favorites.splice(index, 1);
          saveFavorites();
          updateStarButton();
        });

        row.append(openButton, removeButton);
        favoritesElement.append(row);
      });
    }

    function saveFavorites() {
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
      renderFavorites();
    }

    function isCurrentPlaceStarred() {
      if (!currentPlace) return false;

      return favorites.some(place =>
        Math.abs(place.latitude - currentPlace.latitude) < 0.01 &&
        Math.abs(place.longitude - currentPlace.longitude) < 0.01
      );
    }

    function updateStarButton() {
      const button = document.querySelector("#toggle-star");
      const starred = isCurrentPlaceStarred();

      button.textContent = starred ? "★" : "☆";
      button.title = starred ? "Remove this place from starred places" : "Star this place";
      button.setAttribute(
        "aria-label",
        starred ? "Remove this place from starred places" : "Star this place"
      );
    }

    function updateUnitControl() {
      const isFahrenheit = unit === "F";
      document.querySelector("#unit-toggle").checked = isFahrenheit;
      document.querySelector("#unit-toggle").setAttribute(
        "aria-checked",
        String(isFahrenheit)
      );
      document.querySelector("#celsius-label").classList.toggle("active", !isFahrenheit);
      document.querySelector("#fahrenheit-label").classList.toggle("active", isFahrenheit);
    }

    function addDetail(label, value) {
      const item = document.createElement("div");
      item.className = "detail";

      const name = document.createElement("span");
      name.className = "detail-label";
      name.textContent = label;

      const text = document.createElement("span");
      text.className = "detail-value";
      text.textContent = value;

      item.append(name, text);
      return item;
    }

    function formatHour(time) {
      return new Date(time).toLocaleTimeString(undefined, { hour: "numeric" });
    }

    function renderWeather() {
      if (!latestWeather || !currentPlace) return;

      const data = latestWeather;
      const current = data.current;
      const daily = data.daily;

      document.body.dataset.weather = weatherType(current.weather_code);
      document.querySelector("#place").textContent = currentPlace.name;
      document.querySelector("#temperature").textContent =
        displayTemperature(current.temperature_2m);
      document.querySelector("#description").textContent =
        weatherText(current.weather_code);
      document.querySelector("#high-low").textContent =
        `High ${displayTemperature(daily.temperature_2m_max[0])} · ` +
        `Low ${displayTemperature(daily.temperature_2m_min[0])}`;
      document.querySelector("#current").hidden = false;

      const hourly = document.querySelector("#hourly");
      hourly.replaceChildren();

      const foundIndex = data.hourly.time.findIndex(time => time >= current.time);
      const startIndex = Math.max(0, foundIndex);

      for (let offset = 0; offset < 24; offset += 3) {
        const index = startIndex + offset;
        if (index >= data.hourly.time.length) break;

        const item = document.createElement("div");
        item.className = "hour";

        const time = document.createElement("span");
        time.className = "hour-time";
        time.textContent = offset === 0 ? "Now" : formatHour(data.hourly.time[index]);

        const icon = document.createElement("span");
        icon.className = "hour-icon";
        icon.textContent = weatherIcon(data.hourly.weather_code[index]);
        icon.setAttribute("aria-label", weatherText(data.hourly.weather_code[index]));

        const temp = document.createElement("span");
        temp.className = "hour-temp";
        temp.textContent = displayTemperature(data.hourly.temperature_2m[index]);

        item.append(time, icon, temp);
        hourly.append(item);
      }

      document.querySelector("#hourly-panel").hidden = false;

      const details = document.querySelector("#details");
      details.replaceChildren(
        addDetail("Feels like", displayTemperature(current.apparent_temperature)),
        addDetail("Humidity", `${current.relative_humidity_2m}%`),
        addDetail(
          "Wind",
          `${Math.round(current.wind_speed_10m)} ${data.current_units.wind_speed_10m}`
        ),
        addDetail(
          "Sunrise",
          new Date(daily.sunrise[0]).toLocaleTimeString(undefined, {
            hour: "numeric",
            minute: "2-digit"
          })
        ),
        addDetail(
          "Sunset",
          new Date(daily.sunset[0]).toLocaleTimeString(undefined, {
            hour: "numeric",
            minute: "2-digit"
          })
        ),
        addDetail(
          "Rain chance",
          `${data.hourly.precipitation_probability[startIndex] ?? 0}%`
        )
      );
      document.querySelector("#details-panel").hidden = false;

      const forecast = document.querySelector("#forecast");
      forecast.replaceChildren();

      daily.time.forEach((date, index) => {
        const row = document.createElement("div");
        row.className = "forecast-day";

        const day = document.createElement("span");
        day.textContent = index === 0
          ? "Today"
          : new Date(`${date}T12:00:00`).toLocaleDateString(undefined, {
              weekday: "long"
            });

        const condition = document.createElement("span");
        condition.className = "forecast-condition";
        condition.textContent =
          `${weatherIcon(daily.weather_code[index])} ${weatherText(daily.weather_code[index])}`;

        const temperatures = document.createElement("span");
        temperatures.className = "forecast-temps";
        temperatures.textContent =
          `${displayTemperature(daily.temperature_2m_min[index])} / ` +
          `${displayTemperature(daily.temperature_2m_max[index])}`;

        row.append(day, condition, temperatures);
        forecast.append(row);
      });

      updateStarButton();
    }

    async function showWeather(place, latitude, longitude) {
      message.textContent = "Loading weather…";

      try {
        const params = new URLSearchParams({
          latitude,
          longitude,
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m",
          hourly: "temperature_2m,precipitation_probability,weather_code",
          daily: "weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset",
          forecast_days: "5",
          timezone: "auto"
        });

        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
        if (!response.ok) {
          throw new Error("Weather service is unavailable. Please try again.");
        }

        latestWeather = await response.json();
        currentPlace = {
          name: place,
          latitude: Number(latitude),
          longitude: Number(longitude)
        };

        renderWeather();
        message.textContent = "";
      } catch (error) {
        message.textContent =
          error.message || "Could not load the weather. Please try again.";
      }
    }

    document.querySelector("#unit-toggle").addEventListener("change", event => {
      unit = event.target.checked ? "F" : "C";
      localStorage.setItem(UNIT_KEY, unit);
      updateUnitControl();
      renderWeather();
    });

    document.querySelector("#toggle-star").addEventListener("click", () => {
      if (!currentPlace) return;

      const existingIndex = favorites.findIndex(place =>
        Math.abs(place.latitude - currentPlace.latitude) < 0.01 &&
        Math.abs(place.longitude - currentPlace.longitude) < 0.01
      );

      if (existingIndex >= 0) {
        favorites.splice(existingIndex, 1);
      } else {
        favorites.unshift({ ...currentPlace });
      }

      saveFavorites();
      updateStarButton();
    });

    document.querySelector("#search-form").addEventListener("submit", async event => {
      event.preventDefault();

      const query = document.querySelector("#city").value.trim();
      if (!query) return;

      message.textContent = "Finding location…";

      try {
        const params = new URLSearchParams({
          name: query,
          count: "1",
          language: "en",
          format: "json"
        });

        const response = await fetch(
          `https://geocoding-api.open-meteo.com/v1/search?${params}`
        );

        if (!response.ok) {
          throw new Error("Location search failed. Please try again.");
        }

        const data = await response.json();
        const result = data.results?.[0];

        if (!result) {
          message.textContent = "No matching city found. Try another search.";
          return;
        }

        const place = [result.name, result.admin1, result.country]
          .filter((value, index, list) => value && list.indexOf(value) === index)
          .join(", ");

        await showWeather(place, result.latitude, result.longitude);
      } catch (error) {
        message.textContent =
          error.message || "Could not search for that location.";
      }
    });

    updateUnitControl();
    renderFavorites();
  </script>
</body>
</html>
